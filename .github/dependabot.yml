# Version updates wait 7 days after a release (a compromised package is usually pulled within
# days); security updates ignore the cooldown and arrive at once. Locks: deploy/lock.sh.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    allow:
      - dependency-type: all  # indirect libraries are pinned in the hashed locks too
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  # pip-tools itself, locked in deploy/pip-tools.txt
  - package-ecosystem: pip
    directory: /deploy
    allow:
      - dependency-type: all
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pip-tools:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades (React, Tailwind, TypeScript) need hands-on migration work.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docs-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Stay on a released, supported Python line; bump deliberately.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

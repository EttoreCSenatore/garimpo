[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garimpo"
version = "1.0.0"
description = "Garimpo: catalog scraper, REST API and chat search for a Brazilian sports store"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "selectolax>=0.3",
    "lxml>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlmodel>=0.0.16",
    "APScheduler>=3.10",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Current coverage is about 88 %; the floor starts a little below and moves up to 90 %.
fail_under = 85
show_missing = true
skip_covered = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", "website"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501", "B008", "UP042", "S311"]  # S311: random is used only for politeness jitter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
